services:
  - type: web
    name: ticket-desk
    runtime: static
    buildCommand: bash build.sh
    staticPublishPath: ./public
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
